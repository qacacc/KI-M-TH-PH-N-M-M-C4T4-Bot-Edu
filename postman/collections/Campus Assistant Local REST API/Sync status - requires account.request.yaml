$kind: http-request
url: "{{BASE_URL}}/api/v1/sync/status"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 400', function () { pm.response.to.have.status(400); });
      const body = pm.response.json();
      pm.test('Có mã lỗi validation', function () { pm.expect(body.error.code).to.eql('VALIDATION_ERROR'); });
    language: text/javascript
order: 7000
