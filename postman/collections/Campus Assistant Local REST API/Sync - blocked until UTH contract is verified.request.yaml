$kind: http-request
url: "{{BASE_URL}}/api/v1/sync"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: "{}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 503', function () { pm.response.to.have.status(503); });
      const body = pm.response.json();
      pm.test('Không giả thành công', function () { pm.expect(body.success).to.eql(false); pm.expect(body.error.code).to.eql('SYNC_NOT_READY'); });
    language: text/javascript
order: 6000
