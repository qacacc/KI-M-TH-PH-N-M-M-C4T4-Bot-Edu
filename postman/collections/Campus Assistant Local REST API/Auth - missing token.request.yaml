$kind: http-request
url: "{{BASE_URL}}/api/v1/health"
method: GET
auth: "{\"type\":\"noauth\"}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 401', function () { pm.response.to.have.status(401); });
      const body = pm.response.json();
      pm.test('Có header WWW-Authenticate', function () { pm.expect(pm.response.headers.get('WWW-Authenticate')).to.eql('Bearer'); });
      pm.test('Envelope lỗi chuẩn', function () { pm.expect(body.success).to.eql(false); pm.expect(body.error.code).to.eql('UNAUTHORIZED'); pm.expect(body.data).to.eql(null); });
    language: text/javascript
order: 2000
